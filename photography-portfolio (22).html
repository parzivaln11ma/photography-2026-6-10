<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-w: 175px;
    --navy: #1B2A5E;
    --navy-dark: #152248;
    --sidebar-text: rgba(255,255,255,0.82);
    --sidebar-text-dim: rgba(255,255,255,0.45);
    --sidebar-active: #FFFFFF;
    --sidebar-active-bg: rgba(255,255,255,0.10);
    --main-bg: #FAFAF8;
    --text-primary: #111110;
    --text-secondary: #6B6B65;
    --text-muted: #A8A8A2;
    --border: rgba(17,17,16,0.09);
    --font: 'Inter', system-ui, sans-serif;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    display: flex;
    background: var(--main-bg);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    min-height: 100vh;
    background: var(--navy);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 200;
    padding: 0;
    transition: transform 0.25s ease;
  }

  .sidebar.collapsed {
    transform: translateX(-175px);
  }

  .main {
    transition: margin-left 0.25s ease;
  }

  body.sidebar-collapsed .main {
    margin-left: 0;
  }

  .sidebar-top {
    padding: 4rem 1.2rem 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .hamburger {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 4px;
    position: fixed;
    top: 1.2rem;
    left: 1.2rem;
    z-index: 300;
  }

  .hamburger span {
    display: block;
    width: 20px;
    height: 1.5px;
    background: rgba(255,255,255,0.7);
    transition: background 0.2s;
  }

  body.sidebar-collapsed .hamburger span {
    background: rgba(17,17,16,0.5);
  }

  .sidebar-logo {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.09em;
    color: #FFFFFF;
    text-transform: uppercase;
    line-height: 1.35;
    text-decoration: none;
    display: block;
    text-align: right;
  }

  .sidebar-nav {
    flex: 1;
    padding: 1.4rem 0;
  }

  .sidebar-nav a {
    display: block;
    text-align: right;
    padding: 6px 1.2rem;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--sidebar-text);
    text-decoration: none;
    transition: color 0.15s, background 0.15s;
    border-left: 2px solid transparent;
  }

  .sidebar-nav a:hover {
    color: #fff;
    background: rgba(255,255,255,0.06);
  }

  .sidebar-nav a.active {
    color: #fff;
    background: rgba(255,255,255,0.10);
    border-left-color: #fff;
  }

  .sidebar-bottom {
    padding: 1rem 1.2rem 2rem;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .sidebar-bottom a {
    display: block;
    text-align: right;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--sidebar-text-dim);
    text-decoration: none;
    padding: 3.5px 0;
    transition: color 0.15s;
  }

  .sidebar-bottom a:hover { color: rgba(255,255,255,0.75); }

  /* ── B&W TOGGLE ── */
  .bw-btn {
    position: fixed;
    top: 1.2rem;
    right: 1.5rem;
    z-index: 300;
    background: var(--text-primary);
    color: #fff;
    border: none;
    font-family: var(--font);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    padding: 7px 14px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: none;
  }

  .bw-btn:hover { background: #444; }
  .bw-btn.visible { display: block; }

  body.bw-mode .main,
  body.bw-mode .sidebar {
    filter: grayscale(100%);
  }

  /* ── MAIN ── */
  .main {
    margin-left: var(--sidebar-w);
    flex: 1;
    background: var(--main-bg);
    min-height: 100vh;
  }

  /* ── GALLERY MODE ── */
  .gallery-view {
    padding: 3.5rem 4rem 5rem;
  }

  .gallery-header {
    margin-bottom: 2.5rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.2rem;
  }

  .gallery-header h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }



  /* masonry */
  .masonry {
    columns: 3;
    column-gap: 10px;
  }

  @media (max-width: 1100px) { .masonry { columns: 2; } }
  @media (max-width: 760px) {
    .masonry { columns: 1; }
    .gallery-view { padding: 2rem 1.5rem 4rem; }
    .gallery-header { flex-direction: column; gap: 1rem; }
  }

  .photo-item {
    break-inside: avoid;
    margin-bottom: 10px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    background: #D8D8D4;
    transition: opacity 0.25s;
  }

  .photo-item.hidden { display: none; }

  .photo-item img {
    display: block;
    width: 100%;
    height: auto;
    transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94);
  }

  .photo-item:hover img { transform: scale(1.04); }

  .photo-overlay { display: none; }

  /* ── SINGLE VIEW ── */
  .single-view {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 4rem 3rem 5rem;
    min-height: 100vh;
  }

  .single-view.active { display: flex; }
  .gallery-view.hidden { display: none; }

  .single-img-wrap {
    width: 100%;
    max-width: 900px;
    position: relative;
  }

  .single-img-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }

  .single-img-wrap.portrait img {
    width: auto;
    max-height: 70vh;
    max-width: 100%;
    margin: 0 auto;
  }

  .single-caption { display: none; }

  .single-nav {
    display: flex;
    gap: 1.5rem;
    margin-top: 1.8rem;
  }

  .single-nav button {
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    font-size: 18px;
    color: var(--text-secondary);
    padding: 6px 10px;
    transition: color 0.15s;
  }

  .single-nav button:hover { color: var(--text-primary); }

  .back-btn {
    align-self: flex-start;
    margin-bottom: 2rem;
    background: none;
    border: none;
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s;
  }

  .back-btn:hover { color: var(--text-primary); }

  /* mobile sidebar toggle */
  @media (max-width: 640px) {
    :root { --sidebar-w: 0px; }
    .sidebar { transform: translateX(-175px); width: 175px; }
    .sidebar:not(.collapsed) { transform: translateX(0); }
    .main { margin-left: 0; }
    .gallery-view { padding: 2rem 1.5rem 4rem; }
    .gallery-header { flex-direction: column; gap: 1rem; padding-left: 3rem; padding-top: 3rem; }
    .single-view { padding-top: 4rem; }
    .sidebar-top { padding-top: 5rem; }
  }
</style>

<script>
  const allItems = document.querySelectorAll('.photo-item');
  const galleryView = document.getElementById('galleryView');
  const singleView = document.getElementById('singleView');
  const singleImg = document.getElementById('singleImg');
  const singleTitle = document.getElementById('singleTitle');
  const singleLoc = document.getElementById('singleLoc');
  const galleryTitle = document.getElementById('galleryTitle');
  const navLinks = document.querySelectorAll('.sidebar-nav a');
  const bwBtn = document.getElementById('bwBtn');
  let visibleItems = [];
  let currentIdx = 0;
  let currentLocation = 'london';
  let bwMode = false;

  const hasBW = ['london'];

  function getActiveKey() {
    return bwMode ? currentLocation + '-bw' : currentLocation;
  }

  function applyGallery() {
    const key = getActiveKey();
    allItems.forEach(item => {
      item.classList.toggle('hidden', item.dataset.location !== key);
    });
    visibleItems = [...allItems].filter(i => i.dataset.location === key);
    singleView.classList.remove('active');
    galleryView.classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function switchLocation(loc) {
    currentLocation = loc;
    bwMode = false;
    document.body.classList.remove('bw-mode');
    navLinks.forEach(a => a.classList.toggle('active', a.dataset.location === loc));
    galleryTitle.textContent = loc.charAt(0).toUpperCase() + loc.slice(1);
    bwBtn.classList.toggle('visible', hasBW.includes(loc));
    bwBtn.textContent = 'B\u0026W';
    applyGallery();
  }

  navLinks.forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      switchLocation(a.dataset.location);
    });
  });

  // B&W toggle
  bwBtn.addEventListener('click', () => {
    bwMode = !bwMode;
    document.body.classList.toggle('bw-mode', bwMode);
    bwBtn.textContent = bwMode ? 'Color' : 'B\u0026W';
    applyGallery();
  });

  // Init sidebar — collapsed on mobile, visible on desktop
  if (window.innerWidth <= 640) {
    document.querySelector('.sidebar').classList.add('collapsed');
  }

  // Init with London
  switchLocation('london');

  function openSingle(idx) {
    currentIdx = idx;
    const item = visibleItems[idx];
    const imgWrap = document.querySelector('.single-img-wrap');
    singleImg.src = item.querySelector('img').src;
    singleImg.alt = item.querySelector('img').alt;
    singleTitle.textContent = item.dataset.title;
    singleLoc.textContent = item.dataset.loc;
    imgWrap.classList.toggle('portrait', item.dataset.portrait === 'true');
    galleryView.classList.add('hidden');
    singleView.classList.add('active');
    window.scrollTo(0, 0);
  }

  allItems.forEach(item => {
    item.addEventListener('click', () => {
      const idx = visibleItems.indexOf(item);
      if (idx !== -1) openSingle(idx);
    });
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    singleView.classList.remove('active');
    galleryView.classList.remove('hidden');
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    openSingle((currentIdx - 1 + visibleItems.length) % visibleItems.length);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    openSingle((currentIdx + 1) % visibleItems.length);
  });

  document.addEventListener('keydown', e => {
    if (!singleView.classList.contains('active')) return;
    if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
    if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
    if (e.key === 'Escape') document.getElementById('backBtn').click();
  });

  document.getElementById('hamburger').addEventListener('click', () => {
    const sidebar = document.querySelector('.sidebar');
    const isMobile = window.innerWidth <= 640;
    if (isMobile) {
      // On mobile: sidebar starts hidden (collapsed), clicking shows it
      sidebar.classList.toggle('collapsed');
      document.body.classList.toggle('sidebar-collapsed', sidebar.classList.contains('collapsed'));
    } else {
      // On desktop: sidebar starts visible, clicking hides it
      sidebar.classList.toggle('collapsed');
      document.body.classList.toggle('sidebar-collapsed', sidebar.classList.contains('collapsed'));
    }
  });
</script>
</body>
</html>
